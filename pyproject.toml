[project]
name = "pyhantek"
version = "0.1.0"
description = "Modern Python/Qt oscilloscope app for Hantek DSO-6022 family USB scopes"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.7",
    "pyusb>=1.2.1",
    "numpy>=1.26",
    "libusb-package>=1.0.26; sys_platform == 'win32' or sys_platform == 'darwin'",
    "mcp>=2.3",
]

[project.scripts]
pyhantek = "pyhantek.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyhantek"]

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]
