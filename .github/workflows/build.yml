name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_DEPS: >-
    libusb-1.0-0 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 file

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y $QT_DEPS
      - run: uv sync
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  appimage:
    needs: test
    # oldest supported runner -> the AppImage runs on distros with glibc >= 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y $QT_DEPS
      - run: bash packaging/build_appimage.sh
      # reuses the PyInstaller bundle from the AppImage step
      - run: bash packaging/build_deb.sh
        env:
          PYHANTEK_REUSE_BUILD: "1"
      - name: Check the .deb installs
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/pyhantek
          test -f /usr/share/applications/pyhantek.desktop
          test -f /lib/udev/rules.d/60-openhantek.rules
          sudo apt-get remove -y pyhantek
      - uses: actions/upload-artifact@v4
        with:
          name: PyHantek-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PyHantek-windows-x64
          path: |
            dist/*.exe
            dist/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
